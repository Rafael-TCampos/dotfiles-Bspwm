[window]
opacity = 0.85
blur = true
padding = { x = 10, y = 8 }

[font]
size = 11.5

[font.normal]
family = "JetBrainsMono Nerd Font"

[font.bold]
family = "JetBrainsMono Nerd Font"

[font.italic]
family = "JetBrainsMono Nerd Font"

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 750   

[terminal]
shell = "/usr/bin/zsh"
